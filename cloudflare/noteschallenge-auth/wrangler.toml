name = "noteschallenge-auth"
main = "worker.js"
compatibility_date = "2026-11-01"

# Single-file worker. Deploy the module as-is (no bundler, no npm imports).

[[d1_databases]]
binding = "DB"
database_name = "noteschallenge-auth"
database_id = "688d6340-51fc-4959-8499-c1892d6b4e70"

# Required at runtime (Cloudflare dashboard Variables / Secrets, or wrangler):
#   JWT_SECRET              secret, long random string. Signs the 30-day session JWT.
#   GOOGLE_CLIENT_ID        the public Web OAuth client id (same value as auth-config.js googleClientId).
#   ALLOWED_EMAIL_DOMAINS   optional comma-separated school domains. Empty or unset = any verified Google account.
#   EXTRA_ALLOWED_EMAILS    optional secret: comma-separated exact emails that may sign in
#                           without a roster row. This does not allow a whole domain.
#                           Set it with: npx wrangler secret put EXTRA_ALLOWED_EMAILS
#                           Unset, these accounts stay on the cskphc tenant.
#   EXTRA_ALLOWED_EMAIL_SCHOOLS  optional plain var, email=schoolId pairs. Not a secret.
#                           Leave unset so current teacher logins stay on cskphc.
#   DEFAULT_SCHOOL_ID       optional. Unset means cskphc.
#                           After the tenancy tables: npx wrangler d1 execute noteschallenge-auth --remote --file=migrate-tenancy.sql
#                           Do that before deploying this worker. Do not set NOW.
#                           Deploy with keep_bindings so existing secrets stay.
# Class cards and presence reuse the existing profiles and presence tables.
# They require a roster session from Google sign-in. A name picked on the hub
# is not a credential. Do not deploy this worker until the owner says 要上.
# Do not set NOW in production; it is only a test clock.
#
# Do not commit JWT_SECRET or EXTRA_ALLOWED_EMAILS. GOOGLE_CLIENT_ID is public but must match the token `aud`.
#
# Live classroom quizzes add live_quizzes, live_rooms, and live_results.
# Apply once before a deploy that includes those routes:
#   npx wrangler d1 execute noteschallenge-auth --remote --file=migrate-live-quiz.sql
# 3D Music Party World rooms (/world/*) add world_rooms for cross-isolate persistence:
#   npx wrangler d1 execute noteschallenge-auth --remote --file=migrate-world-3d.sql
# Deploy from this directory only when the owner says so:
#   npx wrangler deploy
# Keep the existing d1, secret_text, and plain_text bindings (keep_bindings).
# Do not change ALLOWED_EMAIL_DOMAINS, JWT_SECRET, or EXTRA_ALLOWED_EMAILS.
# Do not set NOW. Do not set compatibility_date to "now" or Date.now().
