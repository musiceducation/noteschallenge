name = "noteschallenge-auth"
main = "worker.js"
compatibility_date = "2026-11-01"

# Single-file worker. Deploy the module as-is (no bundler, no npm imports).
# Replace database_id after `wrangler d1 create noteschallenge-auth`.

[[d1_databases]]
binding = "DB"
database_name = "noteschallenge-auth"
database_id = "00000000-0000-0000-0000-000000000000"

# Required at runtime (Cloudflare dashboard Variables / Secrets, or wrangler):
#   JWT_SECRET              secret, long random string. Signs the 30-day session JWT.
#   GOOGLE_CLIENT_ID        the public Web OAuth client id (same value as auth-config.js googleClientId).
#   ALLOWED_EMAIL_DOMAINS   optional comma-separated domains. Empty or unset = any verified Google account.
#
# Do not commit JWT_SECRET. GOOGLE_CLIENT_ID is public but must match the token `aud`.
